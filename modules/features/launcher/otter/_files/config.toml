[general]
cheatsheet_entry = "?"
cheatsheet_viewer = "less -R; clear"
clear_screen_after_execution = false
default_module = "app"
empty_module = ""
esc_to_abort = true
exec_cmd = "sh -c"
external_editor = ""
loop_mode = false
vi_mode = true
height = 14

[interface]
merge_default_module_suggestions = true
padding = [0, 1, 0, 1]
header = '''
$(
load=$(awk 'NR == 1 {print $1"%"}' /proc/loadavg)
mem=$(free -h | awk 'NR == 2 {print $3}' | sed 's/Gi/0G/')

left="$USER@$HOSTNAME"
left="> $left"
right="> $load%  > $mem"

gap=$(( COLUMNS - ${#left} - ${#right} ))
(( gap < 0 )) && gap=0

printf '\x1b[34;1m> \x1b[0m%s@%s%*s\x1b[31;1m> \x1b[0m%s  \x1b[33;1m> \x1b[0m%s' "$USER" "$HOSTNAME" "$gap" '' "$load" "$mem"
)
'''
header_color = "blue"
prompt_sign = "> "
prompt_sign_color = "blue"
placeholder = "type & search"
suggestion_mode = "list"
suggestion_position = "bottom"
prefix_color = "yellow"
prefix_padding = 3
description_color = "reset"
selection_prefix = "▌ "
selection_prefix_color = "red"
inverse_selection = true
list_prefix = "  "
list_prefix_color = "reset"
indicator_args = ""
indicator_bare = ""
indicator_color = "red"
scrollbar = true
separator = true
separator_label = "  otter "

[[modules]]
cmd = "setsid -f xdg-open 'https://www.google.com/search?q={}'"
description = "search with google"
prefix = "gg"
url_encode = true
with_argument = true

[[modules]]
suggestions_cmd = '''
GLYPH_DESKTOP='' HIST_FILE='' sway-launcher-desktop list-entries |
awk -F '\034' 'NF == 3 { gsub(/\033\[[0-9;]*m/, "", $3); print $3 "\t" $1 }'
'''
cmd = """
sway-launcher-desktop run-desktop '{}' </dev/null >/dev/null 2>&1
"""
description = "launch desktop programs"
prefix = "app"
with_argument = true
unbind_proc = true

[[modules]]
cmd = """
function power {
if [[ -n $1 ]]; then
case $1 in
"logout") session=`loginctl session-status | head -n 1 | awk '{print $1}'`; loginctl terminate-session $session ;;
"suspend") systemctl suspend ;;
"hibernate") systemctl hibernate ;;
"reboot") systemctl reboot ;;
"shutdown") systemctl poweroff ;;
esac fi }
power $(echo -e 'reboot
shutdown
logout
suspend
hibernate' | fzf --reverse --no-scrollbar --padding 1,3 --prompt 'Power Menu: ' | tail -1)
"""
description = "power menu with fzf"
prefix = "po"

[[modules]]
cmd = "setsid -f xdg-open 'https://wiki.nixos.org/w/index.php?search={}'"
description = "search nix wiki"
prefix = "nixw"
url_encode = true
with_argument = true

[[modules]]
cmd = "setsid -f xdg-open 'https://search.nixos.org/packages?channel=unstable&query={}'"
description = "search for nix packages"
prefix = "nix"
url_encode = true
with_argument = true

[[modules]]
cmd = "pkill -f {}"
description = "kill a program"
prefix = "kill"
url_encode = true
with_argument = true

[[modules]]
cmd = """
xdg-open 'https://apkpure.com/search?q={}'
xdg-open 'https://www.apkmirror.com/?post_type=app_release&searchtype=apk&bundles%5B%5D=apkm_bundles&bundles%5B%5D=apk_files&s={}'
xdg-open 'https://apkcombo.com/search/{}'
"""
description = "search for nix packages"
prefix = "apk"
url_encode = true
with_argument = true

[[modules]]
cmd = """
selected=$(nmcli connection show | rg ' vpn | wireguard ' | cut -d ' ' -f 1 | fzf --padding 1,2 --info-command 'printf " vpn"' --cycle --gutter " " --pointer " ▌" --color "bg+:-1,pointer:1,info:8,separator:8,scrollbar:0" --prompt '>  ')
 
if [ -n "$selected" ]; then
  if [ "$(nmcli connection show --active | rg "$selected")" ];
    then
      nmcli connection down "$selected" > /dev/null 2>&1
    else
      nmcli connection up "$selected" --ask
  fi
fi
"""
description = "connect to a vpn"
prefix = "vpn"

[[modules]]
cmd = """
selected=$(echo -e "$(nmcli -f ssid device wifi list | gawk '{print $1}' | grep -v SSID | sort | uniq)" | fzf --padding 1,2 --info-command 'printf " wifi"' --cycle --gutter " " --pointer " ▌" --color "bg+:-1,pointer:1,info:8,separator:8,scrollbar:0" --prompt '>  ')
 
if [ "$(nmcli connection show --active | rg "$selected")" ]
  then
    nmcli connection down "$selected"
  else
    nmcli connection up "$selected"
fi

"""
description = "switch wifi connection"
prefix = "wifi"

[[modules]]
cmd = """
function power {
    if [[ -n $1 ]]; then
    case $1 in
        "lock") swaylock -f -c 000000;;
        "suspend") systemctl suspend ;;
        "hibernate") systemctl hibernate ;;
        "reboot") systemctl reboot ;;
        "shutdown") systemctl poweroff ;;
    esac 
    fi 
}
power $(echo -e 'reboot
shutdown
lock
suspend
hibernate' | fzf --padding 1,2 --info-command 'printf " power menu ($FZF_POS/$FZF_TOTAL_COUNT)"' --cycle --gutter " " --pointer " ▌" --color "bg+:-1,pointer:1,info:8,separator:8,scrollbar:0" --prompt '>  ' | tail -1)
"""
description = "power menu (fzf)"
prefix = "sys"
